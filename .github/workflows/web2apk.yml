name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Link Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_url:
        description: 'Link Gambar Icon (rasio 1:1, format png/jpg)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (butuh folder android-template)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate package name unik
        id: pkg
        run: |
          SANITIZED=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-20)
          if [ -z "$SANITIZED" ]; then SANITIZED="app"; fi
          TS=$(date +%s)
          echo "package_id=com.web2apk.${SANITIZED}_${TS}" >> "$GITHUB_OUTPUT"

      - name: Copy template ke folder build
        run: cp -r android-template build-project

      - name: Update nama aplikasi (strings.xml)
        run: |
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|" \
            build-project/app/src/main/res/values/strings.xml

      - name: Inject Web URL ke MainActivity (encode sama seperti projectGenerator.js)
        run: |
          ENCODED=$(printf '%s' "${{ inputs.web_url }}" | rev | base64 -w0)
          sed -i "s|private static final String ENCODED_URL = \".*\";|private static final String ENCODED_URL = \"$ENCODED\";|" \
            build-project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|private static final String FALLBACK_URL = \".*\";|private static final String FALLBACK_URL = \"${{ inputs.web_url }}\";|" \
            build-project/app/src/main/java/com/web2apk/app/MainActivity.java

      - name: Update package name (build.gradle + Java files)
        run: |
          PKG="${{ steps.pkg.outputs.package_id }}"
          sed -i "s|applicationId \".*\"|applicationId \"$PKG\"|" build-project/app/build.gradle
          sed -i "s|namespace '.*'|namespace '$PKG'|" build-project/app/build.gradle
          find build-project/app/src/main/java/com/web2apk/app -name "*.java" \
            -exec sed -i "s|package com.web2apk.app;|package $PKG;|" {} \;

      - name: Download & resize icon jadi semua density
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          curl -L "${{ inputs.icon_url }}" -o icon-src.png
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for name in "${!sizes[@]}"; do
            size="${sizes[$name]}"
            dir="build-project/app/src/main/res/mipmap-$name"
            mkdir -p "$dir"
            convert icon-src.png -resize "${size}x${size}!" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Set izin eksekusi gradlew
        run: chmod +x build-project/gradlew

      - name: Build APK (debug, sama seperti apkBuilder.js lokal)
        working-directory: build-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Cari & rename hasil APK
        run: |
          APK_PATH=$(find build-project/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan, build gagal."
            exit 1
          fi
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | tr -cd 'a-zA-Z0-9_-')
          cp "$APK_PATH" "${SAFE_NAME:-app}.apk"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: '*.apk'
