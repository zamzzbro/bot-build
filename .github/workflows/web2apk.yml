name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Link Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_url:
        description: 'Link Gambar Icon (rasio 1:1, format png/jpg)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Package ID from URL
        id: pkg
        run: |
          URL="${{ github.event.inputs.web_url }}"

          # Hapus protokol (http://, https://)
          HOST=$(echo "$URL" | sed -E 's~^[a-zA-Z]+://~~')

          # Hapus path/query setelah domain
          HOST=$(echo "$HOST" | cut -d'/' -f1)

          # Hapus www.
          HOST=$(echo "$HOST" | sed -E 's/^www\.//')

          # Hitung jumlah bagian domain (dipisah titik)
          PARTS=$(echo "$HOST" | tr '.' '\n' | wc -l)

          if [ "$PARTS" -ge 2 ]; then
            # Ambil bagian kedua dari belakang sebagai nama utama
            NAME=$(echo "$HOST" | awk -F'.' '{print $(NF-1)}')
          else
            NAME="$HOST"
          fi

          # Sanitasi: lowercase, hanya huruf/angka
          NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]//g')

          # Fallback jika kosong
          if [ -z "$NAME" ]; then
            NAME="app"
          fi

          PACKAGE_ID="com.${NAME}.app"
          echo "Generated Package ID: $PACKAGE_ID"
          echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

      - name: Download Icon
        run: |
          mkdir -p /home/runner/work/icon
          curl -L "${{ github.event.inputs.icon_url }}" -o /home/runner/work/icon/icon.png

      - name: Resize Icon to 512x512
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert /home/runner/work/icon/icon.png -resize 512x512! /home/runner/work/icon/icon-512.png

      - name: Install JDK for Bubblewrap
        run: |
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Init Bubblewrap Project
        run: |
          mkdir -p twa-project
          cd twa-project
          bubblewrap init --manifest="${{ github.event.inputs.web_url }}/manifest.json" \
            --directory=. \
            --name="${{ github.event.inputs.app_name }}" \
            --packageId="${{ steps.pkg.outputs.package_id }}" \
            --iconUrl="${{ github.event.inputs.icon_url }}" \
            --skipPwaValidation || true

      - name: Generate TWA Manually (fallback)
        run: |
          cd twa-project
          cat > twa-manifest.json << EOF
          {
            "packageId": "${{ steps.pkg.outputs.package_id }}",
            "host": "${{ github.event.inputs.web_url }}",
            "name": "${{ github.event.inputs.app_name }}",
            "launcherName": "${{ github.event.inputs.app_name }}",
            "display": "standalone",
            "themeColor": "#FFFFFF",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": true,
            "startUrl": "${{ github.event.inputs.web_url }}",
            "iconUrl": "${{ github.event.inputs.icon_url }}",
            "maskableIconUrl": "${{ github.event.inputs.icon_url }}",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ github.event.inputs.web_url }}/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "${{ github.event.inputs.web_url }}",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "shareTarget": null,
            "protocolHandlers": [],
            "generatedAt": "auto"
          }
          EOF

      - name: Build APK with Bubblewrap
        run: |
          cd twa-project
          bubblewrap build --skipPwaValidation

      - name: Rename Output APK
        run: |
          find . -name "*.apk" -exec cp {} "${{ github.event.inputs.app_name }}.apk" \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-apk
          path: '**/*.apk'
