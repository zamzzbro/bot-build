# ============================================
# 📊 SET BUILD TYPE
# ============================================
- name: Set Build Type
  id: build_info
  run: |
    BUILD_TYPE="${{ github.event.inputs.build_type }}"
    if [ -z "$BUILD_TYPE" ]; then
      BUILD_TYPE="apk-debug"
    fi
    echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
    echo "Build type: $BUILD_TYPE"

- name: Build APK Debug
  if: steps.build_info.outputs.build_type == 'apk-debug'
  run: |
    # Ensure dependencies
    flutter pub get || flutter pub upgrade
    
    flutter build apk --debug \
      --no-shrink \
      --target-platform android-arm,android-arm64,android-x64
    echo "APK Debug selesai"

- name: Build APK Release
  if: steps.build_info.outputs.build_type == 'apk-release'
  run: |
    # Ensure dependencies
    flutter pub get || flutter pub upgrade
    
    flutter build apk --release \
      --obfuscate \
      --split-debug-info=build/debug-info \
      --target-platform android-arm,android-arm64,android-x64
    echo "APK Release selesai"

- name: Build AAB Release
  if: steps.build_info.outputs.build_type == 'aab-release'
  run: |
    # Ensure dependencies
    flutter pub get || flutter pub upgrade
    
    flutter build appbundle --release \
      --obfuscate \
      --split-debug-info=build/debug-info
    echo "AAB Release selesai"

      - name: Prepare Output Files
        run: |
          mkdir -p output
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')

          if [ "$BUILD_TYPE" = "apk-debug" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_debug_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "apk-release" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "aab-release" ]; then
            AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
            cp "$AAB_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.aab"
          fi

          echo "Output files:"
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ steps.build_info.outputs.build_type }}-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Flutter Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ steps.build_info.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | ${{ github.event.inputs.flutter_version != '' && github.event.inputs.flutter_version || '3.32.8 (default)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh output/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY            echo "=== Fixing AndroidManifest ==="
            
            # Tambahkan xmlns:tools jika belum ada
            if ! grep -q "xmlns:tools" "$MANIFEST"; then
              sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST"
              echo "✅ xmlns:tools added"
            fi
            
            # Tambahkan overrideLibrary jika belum ada
            if ! grep -q "overrideLibrary" "$MANIFEST"; then
              sed -i 's/<application/<application\n        tools:overrideLibrary="com.llfbandit.record"/' "$MANIFEST"
              echo "✅ overrideLibrary added"
            fi
            
            echo "--- AndroidManifest.xml ---"
            head -12 "$MANIFEST"
          fi

      # PERBAIKAN: Fix compileSdk, missing assets & Java errors (AGRESIF)
      - name: 🔧 Fix compileSdk, Assets & Java
        run: |
          echo "=========================================="
          echo "=== FIX 1: compileSdk ke 36 ==="
          echo "=========================================="
          
          # Fix semua file gradle
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | while read f; do
            echo "=== Before: $f ==="
            grep -n "compileSdk" "$f" || echo "(no compileSdk found)"
            
            # Ganti semua variasi compileSdk
            sed -i 's/compileSdkVersion\s*=\?\s*35/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion\s*=\?\s*34/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion\s*=\?\s*33/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*35/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*34/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*33/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk(35)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk(34)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk(33)/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk\s\+35/compileSdk 36/g' "$f"
            sed -i 's/compileSdk\s\+34/compileSdk 36/g' "$f"
            
            echo "=== After: $f ==="
            grep -n "compileSdk" "$f" || echo "(no compileSdk)"
          done
          
          # Juga fix di android/build.gradle
          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion\s*=\?\s*35/compileSdkVersion 36/g' android/build.gradle
            sed -i 's/compileSdk\s*=\?\s*35/compileSdk = 36/g' android/build.gradle
          fi

          echo ""
          echo "=========================================="
          echo "=== FIX 2: Buat folder assets ==="
          echo "=========================================="
          
          # Buat folder assets yang umum
          for dir in assets assets/images assets/videos assets/audio assets/fonts assets/icons; do
            if [ ! -d "$dir" ]; then
              mkdir -p "$dir"
              touch "$dir/.gitkeep"
              echo "✅ Created: $dir/"
            else
              echo "✅ Exists: $dir/"
            fi
          done
          
          # Baca pubspec.yaml dan buat folder yang diperlukan
          if [ -f pubspec.yaml ]; then
            echo "Reading pubspec.yaml for assets..."
            grep -E "^\s+-\s+" pubspec.yaml | sed 's/.*- //' | while read asset; do
              # Hanya buat folder (yang berakhiran /)
              if echo "$asset" | grep -q "/$"; then
                if [ ! -d "$asset" ]; then
                  mkdir -p "$asset"
                  touch "$asset/.gitkeep"
                  echo "✅ Created from pubspec: $asset"
                fi
              else
                # Buat folder parent-nya
                PARENT_DIR=$(dirname "$asset")
                if [ "$PARENT_DIR" != "." ] && [ ! -d "$PARENT_DIR" ]; then
                  mkdir -p "$PARENT_DIR"
                  touch "$PARENT_DIR/.gitkeep"
                  echo "✅ Created parent: $PARENT_DIR/"
                fi
                # Buat placeholder file
                if [ ! -f "$asset" ]; then
                  touch "$asset"
                  echo "✅ Created placeholder: $asset"
                fi
              fi
            done
          fi

          echo ""
          echo "=========================================="
          echo "=== FIX 3: Java InputType ==="
          echo "=========================================="
          
          # Fix Java file
          JAVA_FILE="android/app/src/main/java/com/nullx/pp/LockOverlayService.java"
          if [ -f "$JAVA_FILE" ]; then
            echo "Fixing: $JAVA_FILE"
            # Backup
            cp "$JAVA_FILE" "$JAVA_FILE.bak"
            
            # Ganti TYPE_NUMBER_PASSWORD
            sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD)/g' "$JAVA_FILE"
            
            # Verifikasi
            if grep -q "TYPE_NUMBER_PASSWORD" "$JAVA_FILE"; then
              echo "❌ Fix failed, masih ada TYPE_NUMBER_PASSWORD"
              # Cara alternatif: import yang benar
              if ! grep -q "import android.text.InputType" "$JAVA_FILE"; then
                sed -i '1s/^/import android.text.InputType;\n/' "$JAVA_FILE"
              fi
              # Ganti lagi dengan cara berbeda
              sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/129/g' "$JAVA_FILE"
              echo "✅ Fixed with numeric value 129"
            else
              echo "✅ TYPE_NUMBER_PASSWORD fixed"
            fi
          else
            echo "⚠️ LockOverlayService.java not found, searching..."
            find android -name "*.java" -type f | while read f; do
              if grep -l "TYPE_NUMBER_PASSWORD" "$f" 2>/dev/null; then
                echo "Found in: $f"
                sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD)/g' "$f"
                echo "✅ Fixed: $f"
              fi
            done
          fi

          echo ""
          echo "=========================================="
          echo "=== ALL FIXES COMPLETE ==="
          echo "=========================================="
          
          # Verifikasi akhir
          echo ""
          echo "=== Verification ==="
          echo "compileSdk values:"
          grep -rn "compileSdk" android/ 2>/dev/null | grep -v ".bak" | head -10
          echo ""
          echo "Asset directories:"
          ls -d assets/*/ 2>/dev/null || echo "(no asset dirs)"
          echo ""
          echo "TYPE_NUMBER_PASSWORD occurrences:"
          grep -rn "TYPE_NUMBER_PASSWORD" android/ 2>/dev/null || echo "✅ None found (FIXED!)"

      # ============================================
      # 📦 FLUTTER PUB GET (PERTAMA)
      # ============================================
      - name: Flutter Pub Get
        id: pub_get
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get

      # ============================================
      # 🔧 FIX PUB GET ERRORS (AUTO-ADD MISSING DEPENDENCIES)
      # ============================================
      - name: 🔧 Auto-Fix Missing Dependencies
        id: fix_dependencies
        if: failure() && steps.pub_get.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "=== DETECTED PUB GET FAILURE ==="
          echo "=========================================="
          
          # Backup pubspec.yaml
          cp pubspec.yaml pubspec.yaml.bak
          
          # Analisis error untuk mencari package yang hilang
          echo "📊 Analyzing error for missing packages..."
          
          # Tangkap error pub get
          ERROR_LOG="pub_get_error.log"
          if [ -f "$ERROR_LOG" ]; then
            ERROR_MSG=$(cat "$ERROR_LOG")
          else
            ERROR_MSG="$(flutter pub get 2>&1)" || true
          fi
          
          echo "Error message:"
          echo "$ERROR_MSG" | head -50
          
          # Cari package yang hilang dengan berbagai pola
          MISSING_PACKAGES=()
          
          # Pola 1: "Package not found: xxx"
          while read -r pkg; do
            if [ -n "$pkg" ]; then
              MISSING_PACKAGES+=("$pkg")
              echo "  Found missing (pattern 1): $pkg"
            fi
          done < <(echo "$ERROR_MSG" | grep -oE "Package not found: ['\"]?([a-zA-Z0-9_\-]+)['\"]?" | sed 's/.*: //' | sed "s/'//g" | sed 's/"//g' | sort -u)
          
          # Pola 2: "Error: Cannot find package 'xxx'"
          while read -r pkg; do
            if [ -n "$pkg" ]; then
              MISSING_PACKAGES+=("$pkg")
              echo "  Found missing (pattern 2): $pkg"
            fi
          done < <(echo "$ERROR_MSG" | grep -oE "Cannot find package ['\"]?([a-zA-Z0-9_\-]+)['\"]?" | sed 's/.*'\''//' | sed "s/'\''.*//" | sort -u)
          
          # Pola 3: "Error: Could not find package xxx"
          while read -r pkg; do
            if [ -n "$pkg" ]; then
              MISSING_PACKAGES+=("$pkg")
              echo "  Found missing (pattern 3): $pkg"
            fi
          done < <(echo "$ERROR_MSG" | grep -oE "Could not find package ['\"]?([a-zA-Z0-9_\-]+)['\"]?" | sed 's/.* //' | sed "s/'//g" | sed 's/"//g' | sort -u)
          
          # Pola 4: "Error: The package 'xxx' doesn't exist"
          while read -r pkg; do
            if [ -n "$pkg" ]; then
              MISSING_PACKAGES+=("$pkg")
              echo "  Found missing (pattern 4): $pkg"
            fi
          done < <(echo "$ERROR_MSG" | grep -oE "package ['\"]?([a-zA-Z0-9_\-]+)['\"]? doesn't exist" | sed 's/package //' | sed "s/'//g" | sed 's/"//g' | sed 's/ doesn.*//' | sort -u)
          
          # Pola 5: "because xxx depends on xxx" - cari di dependencies tree
          while read -r pkg; do
            if [ -n "$pkg" ]; then
              MISSING_PACKAGES+=("$pkg")
              echo "  Found missing (pattern 5): $pkg"
            fi
          done < <(echo "$ERROR_MSG" | grep -oE "because [a-zA-Z0-9_\-]+ depends on [a-zA-Z0-9_\-]+" | sed 's/.*depends on //' | sort -u)
          
          # Unique packages
          UNIQUE_PACKAGES=($(printf "%s\n" "${MISSING_PACKAGES[@]}" | sort -u))
          
          if [ ${#UNIQUE_PACKAGES[@]} -eq 0 ]; then
            echo "⚠️ Tidak dapat mendeteksi package yang hilang secara otomatis"
            echo "Mencoba pendekatan alternatif..."
            
            # Coba baca error lebih detail
            echo "$ERROR_MSG" | grep -E "(Error|error|failed|Failed)" | head -20
            
            # Coba tambahkan package umum yang sering hilang
            COMMON_PACKAGES=(
              "flutter_svg"
              "http"
              "dio"
              "provider"
              "get_it"
              "bloc"
              "flutter_bloc"
              "equatable"
              "shared_preferences"
              "sqflite"
              "path_provider"
              "image_picker"
              "camera"
              "permission_handler"
              "device_info_plus"
              "package_info_plus"
              "connectivity_plus"
              "intl"
              "url_launcher"
              "webview_flutter"
              "google_maps_flutter"
              "firebase_core"
              "firebase_auth"
              "cloud_firestore"
              "flutter_local_notifications"
              "flutter_native_splash"
              "flutter_launcher_icons"
            )
            
            # Tambahkan semua package umum
            for pkg in "${COMMON_PACKAGES[@]}"; do
              if ! grep -q "^  $pkg:" pubspec.yaml; then
                UNIQUE_PACKAGES+=("$pkg")
                echo "  Adding common package: $pkg"
              fi
            done
          fi
          
          # Tambahkan dependencies yang hilang
          if [ ${#UNIQUE_PACKAGES[@]} -gt 0 ]; then
            echo ""
            echo "=========================================="
            echo "📦 ADDING MISSING DEPENDENCIES"
            echo "=========================================="
            
            for pkg in "${UNIQUE_PACKAGES[@]}"; do
              # Skip jika sudah ada di pubspec
              if grep -q "^  $pkg:" pubspec.yaml; then
                echo "  ⏭️ $pkg sudah ada di pubspec.yaml"
                continue
              fi
              
              echo "  ➕ Menambahkan: $pkg"
              
              # Cari versi terbaru dari pub.dev
              LATEST_VERSION=$(curl -s "https://pub.dev/api/packages/$pkg" | jq -r '.latest.version' 2>/dev/null || echo "")
              
              if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "null" ]; then
                VERSION="$LATEST_VERSION"
                echo "    📌 Versi terbaru: $VERSION"
              else
                VERSION="any"
                echo "    ⚠️ Gagal mendapatkan versi, menggunakan 'any'"
              fi
              
              # Tambahkan ke dependencies
              if grep -q "^dependencies:" pubspec.yaml; then
                # Cari posisi dependencies
                sed -i "/^dependencies:/a \  $pkg: $VERSION" pubspec.yaml
                echo "    ✅ Dependencies ditambahkan"
              elif grep -q "^dependencies:" pubspec.yaml; then
                sed -i "/^dependencies:/a \  $pkg: $VERSION" pubspec.yaml
                echo "    ✅ Dependencies ditambahkan"
              else
                # Jika tidak ada dependencies section, tambahkan
                echo "" >> pubspec.yaml
                echo "dependencies:" >> pubspec.yaml
                echo "  $pkg: $VERSION" >> pubspec.yaml
                echo "    ✅ Dependencies section created and package added"
              fi
            done
            
            echo ""
            echo "📋 Updated pubspec.yaml dependencies:"
            echo "=========================================="
            grep -A 20 "^dependencies:" pubspec.yaml | head -30
            
          else
            echo "❌ Tidak ada package yang dapat diidentifikasi"
            echo ""
            echo "📋 Current pubspec.yaml dependencies:"
            grep -A 20 "^dependencies:" pubspec.yaml
          fi
          
          # Coba pub get lagi
          echo ""
          echo "=========================================="
          echo "🔄 RETRYING FLUTTER PUB GET..."
          echo "=========================================="
          
          if flutter pub get; then
            echo "✅ Pub get berhasil setelah auto-fix!"
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Pub get masih gagal setelah auto-fix"
            echo "fixed=false" >> $GITHUB_OUTPUT
            
            # Tampilkan error detail
            echo ""
            echo "=== DETAILED ERROR ==="
            flutter pub get -v 2>&1 | tail -50
            
            # Coba alternatif: downgrade semua package
            echo ""
            echo "🔄 Mencoba downgrade packages..."
            if flutter pub downgrade; then
              echo "✅ Downgrade berhasil!"
              echo "fixed=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Downgrade gagal"
              exit 1
            fi
          fi

      # ============================================
      # 🛡️ VALIDATE & REPAIR PUBSPEC
      # ============================================
      - name: 🛡️ Validate & Repair pubspec.yaml
        if: always()
        run: |
          echo "=========================================="
          echo "=== VALIDATING PUBSPEC.YAML ==="
          echo "=========================================="
          
          # Backup
          cp pubspec.yaml pubspec.yaml.backup
            
          # Validasi format YAML
          if command -v yq >/dev/null 2>&1; then
            if ! yq eval '.' pubspec.yaml > /dev/null 2>&1; then
              echo "⚠️ pubspec.yaml memiliki format yang tidak valid!"
              echo "Mencoba memperbaiki..."
              
              # Hapus trailing whitespace
              sed -i 's/[[:space:]]*$//' pubspec.yaml
              
              # Hapus baris kosong di tengah
              sed -i '/^$/N;/\n$/D' pubspec.yaml
            else
              echo "✅ pubspec.yaml valid"
            fi
          else
            echo "⚠️ yq tidak tersedia, skip validasi"
          fi
          
          echo ""
          echo "📋 Dependencies in pubspec.yaml:"
          grep -E "^  [a-zA-Z]" pubspec.yaml | head -20

      # ============================================
      # 🔄 RETRY PUB GET (jika belum sukses)
      # ============================================
      - name: 🔄 Final Pub Get
        if: always() && (steps.pub_get.outcome == 'failure' || steps.fix_dependencies.outcome == 'failure')
        run: |
          echo "=========================================="
          echo "=== FINAL FLUTTER PUB GET ==="
          echo "=========================================="
          
          # Clean cache
          flutter clean
          flutter pub cache repair
            
          # Pub get dengan verbose
          if flutter pub get -v; then
            echo "✅ Pub get FINAL berhasil!"
          else
            echo "❌ Pub get FINAL gagal!"
            echo ""
            echo "=== ERROR DETAILS ==="
            flutter pub get -v 2>&1 | tail -100
            exit 1
          fi

      # ============================================
      # 📊 SET BUILD TYPE
      # ============================================
      - name: Set Build Type
        id: build_info
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="apk-debug"
          fi
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "Build type: $BUILD_TYPE"

      - name: Build APK Debug
        if: steps.build_info.outputs.build_type == 'apk-debug'
        run: |
          # Verify semua dependencies tersedia
          if ! flutter pub get; then
            echo "❌ Dependencies masih bermasalah!"
            echo "Mencoba force upgrade..."
            flutter pub upgrade
            flutter pub get
          fi
          
          flutter build apk --debug \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64
          echo "APK Debug selesai"

      - name: Build APK Release
        if: steps.build_info.outputs.build_type == 'apk-release'
        run: |
          # Verify semua dependencies tersedia
          if ! flutter pub get; then
            echo "❌ Dependencies masih bermasalah!"
            echo "Mencoba force upgrade..."
            flutter pub upgrade
            flutter pub get
          fi
          
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --target-platform android-arm,android-arm64,android-x64
          echo "APK Release selesai"

      - name: Build AAB Release
        if: steps.build_info.outputs.build_type == 'aab-release'
        run: |
          # Verify semua dependencies tersedia
          if ! flutter pub get; then
            echo "❌ Dependencies masih bermasalah!"
            echo "Mencoba force upgrade..."
            flutter pub upgrade
            flutter pub get
          fi
          
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info
          echo "AAB Release selesai"

      - name: Prepare Output Files
        run: |
          mkdir -p output
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')

          if [ "$BUILD_TYPE" = "apk-debug" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_debug_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "apk-release" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
            cp "$APK_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "aab-release" ]; then
            AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
            cp "$AAB_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.aab"
          fi

          echo "Output files:"
          ls -lh output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ steps.build_info.outputs.build_type }}-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Flutter Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ steps.build_info.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter Version | ${{ github.event.inputs.flutter_version != '' && github.event.inputs.flutter_version || '3.32.8 (default)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh output/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
