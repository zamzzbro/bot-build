# 📦 FLUTTER PUB GET (PERTAMA)
# ============================================
- name: Flutter Pub Get
  id: pub_get
  continue-on-error: true
  run: |
    flutter config --no-analytics
    dart --disable-analytics
    flutter pub get || true

# ============================================
# 🔧 AGGRESSIVE FIX PUB GET ERRORS
# ============================================
- name: 🔧 Aggressive Fix Pub Get
  id: aggressive_fix
  if: always()
  run: |
    echo "=========================================="
    echo "=== AGGRESSIVE PUB GET FIX ==="
    echo "=========================================="
    
    # Backup pubspec.yaml
    cp pubspec.yaml pubspec.yaml.bak
    
    echo ""
    echo "📋 STEP 1: Clean and Reset"
    echo "----------------------------------------"
    
    # Clean semua cache
    flutter clean
    rm -rf .pub-cache
    rm -rf pubspec.lock
    
    echo ""
    echo "📋 STEP 2: Fix pubspec.yaml Format"
    echo "----------------------------------------"
    
    # Fix pubspec.yaml - remove special characters dan fix formatting
    sed -i 's/^[[:space:]]*#.*$//g' pubspec.yaml  # Hapus komentar
    sed -i '/^[[:space:]]*$/d' pubspec.yaml       # Hapus baris kosong
    sed -i 's/[[:space:]]*$//' pubspec.yaml       # Hapus trailing spaces
    
    echo ""
    echo "📋 STEP 3: Read Error Logs"
    echo "----------------------------------------"
    
    # Capture error dengan lebih detail
    ERROR_OUTPUT=$(flutter pub get 2>&1) || true
    echo "$ERROR_OUTPUT" > pub_get_error.log
    
    # Ekstrak package yang hilang dengan lebih agresif
    echo "Mencari package yang hilang..."
    MISSING_PACKAGES=()
    
    # Pattern lebih luas
    PATTERNS=(
      "Package not found: ['\"]?([a-zA-Z0-9_\-]+)['\"]?"
      "Cannot find package ['\"]?([a-zA-Z0-9_\-]+)['\"]?"
      "Could not find package ['\"]?([a-zA-Z0-9_\-]+)['\"]?"
      "package ['\"]?([a-zA-Z0-9_\-]+)['\"]? doesn't exist"
      "Error: ([a-zA-Z0-9_\-]+) not found"
      "Failed to load ([a-zA-Z0-9_\-]+)"
      "No version of ([a-zA-Z0-9_\-]+)"
      "depends on ([a-zA-Z0-9_\-]+) any"
      "([a-zA-Z0-9_\-]+) is required"
    )
    
    for pattern in "${PATTERNS[@]}"; do
      while read -r pkg; do
        if [ -n "$pkg" ] && [ "$pkg" != "null" ] && [ "$pkg" != "flutter" ] && [ "$pkg" != "dart" ]; then
          # Skip package internal
          if [[ ! "$pkg" =~ ^(flutter|dart|sky_engine|collection|meta|typed_data|vector_math|material|widgets|rendering|ui|foundation)$ ]]; then
            MISSING_PACKAGES+=("$pkg")
            echo "  Found: $pkg"
          fi
        fi
      done < <(echo "$ERROR_OUTPUT" | grep -oE "$pattern" | sed 's/.*['\'']//' | sed "s/['\'']//g" | sed 's/.* //' | sed 's/://g' | sort -u)
    done
    
    # Unique packages
    UNIQUE_PACKAGES=($(printf "%s\n" "${MISSING_PACKAGES[@]}" | sort -u))
    
    echo ""
    echo "📋 STEP 4: Add All Missing Dependencies"
    echo "----------------------------------------"
    echo "Total packages found: ${#UNIQUE_PACKAGES[@]}"
    
    # Jika tidak ada package terdeteksi, tambahkan package yang umum
    if [ ${#UNIQUE_PACKAGES[@]} -eq 0 ]; then
      echo "⚠️ No specific packages detected, adding common packages..."
      UNIQUE_PACKAGES=(
        "flutter_svg"
        "http"
        "dio"
        "provider"
        "get_it"
        "bloc"
        "flutter_bloc"
        "equatable"
        "shared_preferences"
        "sqflite"
        "path_provider"
        "image_picker"
        "camera"
        "permission_handler"
        "device_info_plus"
        "package_info_plus"
        "connectivity_plus"
        "intl"
        "url_launcher"
        "webview_flutter"
        "google_maps_flutter"
        "firebase_core"
        "firebase_auth"
        "cloud_firestore"
        "flutter_local_notifications"
        "flutter_native_splash"
        "flutter_launcher_icons"
        "audioplayers"
        "just_audio"
        "video_player"
        "chewie"
        "cached_network_image"
        "file_picker"
        "open_file"
        "flutter_downloader"
        "flutter_localizations"
        "flutter_webview"
        "in_app_purchase"
        "admob_flutter"
        "google_sign_in"
        "sign_in_with_apple"
        "firebase_messaging"
        "firebase_storage"
        "firebase_analytics"
        "firebase_crashlytics"
      )
    fi
    
    # Tambahkan semua package ke pubspec.yaml
    echo ""
    echo "Adding packages to pubspec.yaml..."
    
    # Hapus dependencies section yang lama
    sed -i '/^dependencies:/,$d' pubspec.yaml
    
    # Buat dependencies section baru dengan semua package
    # PERBAIKAN: Hapus spasi berlebihan di awal
    cat >> pubspec.yaml << 'EOF'
    
    dependencies:
      flutter:
        sdk: flutter
    EOF
    
    # Tambahkan semua package
    for pkg in "${UNIQUE_PACKAGES[@]}"; do
      # Skip duplicates
      if grep -q "^  $pkg:" pubspec.yaml; then
        continue
      fi
      
      # Get latest version
      LATEST_VERSION=$(curl -s "https://pub.dev/api/packages/$pkg" | jq -r '.latest.version' 2>/dev/null || echo "")
      
      if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "null" ]; then
        VERSION="$LATEST_VERSION"
      else
        VERSION="any"
      fi
      
      # PERBAIKAN: Pastikan indentasi 2 spaces
      echo "  $pkg: $VERSION" >> pubspec.yaml
      echo "  ✅ Added: $pkg ($VERSION)"
    done
    
    echo ""
    echo "📋 STEP 5: Retry Pub Get"
    echo "----------------------------------------"
    
    # Try pub get dengan berbagai cara
    RETRY_COUNT=0
    MAX_RETRY=3
    SUCCESS=false
    
    while [ $RETRY_COUNT -lt $MAX_RETRY ] && [ "$SUCCESS" = false ]; do
      echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRY"
      
      # Clean cache
      flutter clean
      rm -rf ~/.pub-cache
      
      # Try dengan verbose
      if flutter pub get -v; then
        SUCCESS=true
        echo "✅ Pub get SUCCESS!"
        echo "fixed=true" >> $GITHUB_OUTPUT
        break
      else
        echo "❌ Attempt $((RETRY_COUNT+1)) failed"
        
        # Try dengan force
        if flutter pub get --force; then
          SUCCESS=true
          echo "✅ Pub get with --force SUCCESS!"
          echo "fixed=true" >> $GITHUB_OUTPUT
          break
        fi
      fi
      
      RETRY_COUNT=$((RETRY_COUNT+1))
      sleep 5
    done
    
    if [ "$SUCCESS" = false ]; then
      echo "❌ All attempts failed"
      echo "fixed=false" >> $GITHUB_OUTPUT
      
      # Try alternative: pub upgrade
      echo ""
      echo "🔄 Trying pub upgrade..."
      if flutter pub upgrade; then
        echo "✅ Pub upgrade SUCCESS!"
        echo "fixed=true" >> $GITHUB_OUTPUT
      else
        # Try final: pub cache repair
        echo ""
        echo "🔄 Trying pub cache repair..."
        flutter pub cache repair
        if flutter pub get; then
          echo "✅ Pub get after cache repair SUCCESS!"
          echo "fixed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ All fixes failed"
          exit 1
        fi
      fi
    fi

# ============================================
# 🛡️ VALIDATE & REPAIR PUBSPEC (Enhanced)
# ============================================
- name: 🛡️ Validate & Repair pubspec.yaml (Enhanced)
  if: always()
  run: |
    echo "=========================================="
    echo "=== VALIDATING PUBSPEC.YAML (Enhanced) ==="
    echo "=========================================="
    
    echo "📋 Current pubspec.yaml:"
    cat pubspec.yaml
    
    echo ""
    echo "📋 Fixing common issues..."
    
    # Fix 1: Ensure environment sdk
    if ! grep -q "^environment:" pubspec.yaml; then
      echo "Adding environment section..."
      sed -i '1i\
    environment:\
      sdk: ">=3.0.0 <4.0.0"' pubspec.yaml
    fi
    
    # Fix 2: Ensure flutter sdk
    if ! grep -q "sdk: flutter" pubspec.yaml; then
      echo "Adding flutter sdk to dependencies..."
      sed -i '/^dependencies:/a \  flutter:\n    sdk: flutter' pubspec.yaml
    fi
    
    # Fix 3: Remove invalid characters
    sed -i 's/\\r//g' pubspec.yaml
    sed -i 's/\\n//g' pubspec.yaml
    
    # Fix 4: Ensure proper spacing
    sed -i 's/^  [a-zA-Z]/  &/' pubspec.yaml
    
    echo ""
    echo "📋 Fixed pubspec.yaml:"
    cat pubspec.yaml

