name: Flutter Build Bot

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'apk-debug | apk-release | aab-release'
        required: false
        default: 'apk-debug'
        type: choice
        options:
          - apk-debug
          - apk-release
          - aab-release
      flutter_version:
        description: 'Flutter version (kosongkan untuk default)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release tag dari bot'
        required: false
        default: ''
        type: string
      chat_id:
        description: 'Telegram Chat ID tujuan'
        required: false
        default: ''
        type: string

  push:
    branches: [main]
    paths: ['lib/**','pubspec.yaml','pubspec.lock','android/**','assets/**']

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP from Bot Release
        if: github.event.inputs.release_tag != ''
        run: |
          echo "Downloading release: ${{ github.event.inputs.release_tag }}"
          sleep 15
          MAX_RETRY=5
          RETRY=0
          ASSET_URL=""
          while [ $RETRY -lt $MAX_RETRY ]; do
            echo "Attempt $((RETRY+1))/$MAX_RETRY..."
            RELEASE_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.release_tag }}")
            RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
            if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
              ASSET_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].browser_download_url')
              if [ "$ASSET_URL" != "null" ] && [ -n "$ASSET_URL" ]; then
                echo "Asset found: $ASSET_URL"
                break
              fi
            fi
            echo "Waiting 10s..."
            sleep 10
            RETRY=$((RETRY+1))
          done
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "FAILED: Asset not found after $MAX_RETRY retries"
            exit 1
          fi
          curl -L -o project.zip "$ASSET_URL"
          echo "Size: $(du -h project.zip | cut -f1)"
          mkdir -p project_extracted
          unzip -o project.zip -d project_extracted/
          if [ -f "project_extracted/pubspec.yaml" ]; then
            cp -rf project_extracted/* . && cp -rf project_extracted/.* . 2>/dev/null || true
          else
            SUBFOLDER=$(find project_extracted -name "pubspec.yaml" -not -path "*/.*" | head -1)
            if [ -n "$SUBFOLDER" ]; then
              PROJECT_DIR=$(dirname "$SUBFOLDER")
              cp -rf "$PROJECT_DIR"/* . && cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
            else
              echo "pubspec.yaml NOT FOUND"
              ls -laR project_extracted/ | head -50
              exit 1
            fi
          fi
          rm -rf project_extracted project.zip
          echo "Project ready:"
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version != '' && github.event.inputs.flutter_version || '3.32.8' }}
          channel: 'stable'
          cache: true

      - name: Regenerate Launcher Icons
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          SOURCE_ICON=""
          for f in assets/icon/icon.jpg assets/icon/icon.png assets/icon/icon.webp; do
            [ -f "$f" ] && SOURCE_ICON="$f" && break
          done
          if [ -n "$SOURCE_ICON" ]; then
            find android/app/src/main/res -name "ic_launcher*" -type f -delete
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi) SIZE=48 ;; hdpi) SIZE=72 ;; xhdpi) SIZE=96 ;; xxhdpi) SIZE=144 ;; xxxhdpi) SIZE=192 ;;
              esac
              mkdir -p android/app/src/main/res/mipmap-$density
              convert "$SOURCE_ICON" -resize ${SIZE}x${SIZE} android/app/src/main/res/mipmap-$density/ic_launcher.png
            done
            echo "Icons regenerated"
          fi

      - name: Clean Icon Resources
        run: |
          find android/app/src/main/res -type f \( -name "ic_launcher.jpg" -o -name "ic_launcher.webp" -o -name "ic_launcher_round.jpg" -o -name "ic_launcher_round.webp" \) -delete 2>/dev/null || true
          find android/app/src/main/res -name "ic_launcher*" -type f -size 0 -delete 2>/dev/null || true

      - name: Fix Java and Namespace
        run: |
          FILE_PATH="android/app/src/main/java/com/nullx/pp/SpyService.java"
          [ -f "$FILE_PATH" ] && sed -i '/import com.nullx.pp.R;/d' "$FILE_PATH" || true
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ] && ! grep -q "namespace 'com.nullx.pp'" "$BUILD_GRADLE"; then
            sed -i "/android {/a \\    namespace 'com.nullx.pp'" "$BUILD_GRADLE"
          fi

      - name: Fix Kotlin Version
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "kotlin_version" "$BUILD_GRADLE"; then
              sed -i "s/ext\\.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.10'/" "$BUILD_GRADLE"
            else
              sed -i "/buildscript {/a\\\\    ext.kotlin_version = '1.9.10'" "$BUILD_GRADLE"
            fi
          fi

      - name: Fix minSdkVersion and AndroidManifest
        run: |
          find android -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$f"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$f"
            sed -i 's/minSdk(flutter.minSdkVersion)/minSdk(23)/g' "$f"
            sed -i 's/minSdk = 21/minSdk = 23/g' "$f"
          done
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "xmlns:tools" "$MANIFEST"; then
            sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST"
          fi

      - name: Fix compileSdk and Assets
        run: |
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | while read f; do
            sed -i 's/compileSdkVersion\s*=\?\s*3[3-5]/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*3[3-5]/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk([3][3-5])/compileSdk(36)/g' "$f"
          done
          for dir in assets assets/images assets/fonts assets/icons; do
            [ ! -d "$dir" ] && mkdir -p "$dir" && touch "$dir/.gitkeep" || true
          done

      - name: Set Build Type
        id: build_info
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="apk-debug"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: Flutter Pub Get
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get 2>&1 | tee /tmp/pub_get.log

      - name: Build APK Debug
        if: steps.build_info.outputs.build_type == 'apk-debug'
        run: flutter build apk --debug --no-shrink --target-platform android-arm,android-arm64,android-x64 2>&1 | tee /tmp/build.log

      - name: Build APK Release
        if: steps.build_info.outputs.build_type == 'apk-release'
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm,android-arm64,android-x64 2>&1 | tee /tmp/build.log

      - name: Build AAB Release
        if: steps.build_info.outputs.build_type == 'aab-release'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info 2>&1 | tee /tmp/build.log

      - name: Prepare Output
        id: output
        run: |
          mkdir -p output
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          if [ "$BUILD_TYPE" = "apk-debug" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
            OUT_FILE="output/${APP_NAME}_debug_${TIMESTAMP}.apk"
          elif [ "$BUILD_TYPE" = "apk-release" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
            OUT_FILE="output/${APP_NAME}_release_${TIMESTAMP}.apk"
          else
            APK_PATH=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
            OUT_FILE="output/${APP_NAME}_release_${TIMESTAMP}.aab"
          fi
          cp "$APK_PATH" "$OUT_FILE"
          APK_SIZE=$(stat -c%s "$OUT_FILE")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE/1048576" | bc)
          echo "OUTPUT_FILE=$OUT_FILE" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK_SIZE_MB=$APK_SIZE_MB" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Output: $OUT_FILE ($APK_SIZE_MB MB)"

      - name: Upload Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ steps.build_info.outputs.build_type }}-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: error

      - name: Send APK to Telegram
        if: success() && github.event.inputs.chat_id != ''
        run: |
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OUTPUT_FILE="${{ steps.output.outputs.OUTPUT_FILE }}"
          APK_SIZE="${{ steps.output.outputs.APK_SIZE }}"
          APK_SIZE_MB="${{ steps.output.outputs.APK_SIZE_MB }}"
          APP_NAME="${{ steps.output.outputs.APP_NAME }}"
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$APK_SIZE" -le 52428800 ]; then
            echo "Sending APK directly to Telegram..."
            CAPTION="Build Selesai! App: ${APP_NAME} | Type: ${BUILD_TYPE} | Size: ${APK_SIZE_MB} MB | GitHub Actions"
            SEND_RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${OUTPUT_FILE}" \
              -F "caption=${CAPTION}" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument")
            echo "Telegram HTTP: $SEND_RESULT"
          else
            echo "APK too large (${APK_SIZE_MB} MB > 50MB), sending download info..."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=Build selesai! APK ${APP_NAME} (${APK_SIZE_MB} MB) terlalu besar untuk dikirim langsung. Download di: ${RUN_URL}" \
              -d "parse_mode=HTML"
          fi

      - name: Send Error to Telegram on Failure
        if: failure() && github.event.inputs.chat_id != ''
        run: |
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LOG_FILE="/tmp/full_error.txt"
          echo "=== BUILD ERROR ===" > $LOG_FILE
          echo "Date: $(date)" >> $LOG_FILE
          echo "Build: ${{ steps.build_info.outputs.build_type }}" >> $LOG_FILE
          echo "" >> $LOG_FILE
          [ -f "/tmp/build.log" ] && echo "=== BUILD LOG ===" >> $LOG_FILE && cat /tmp/build.log >> $LOG_FILE
          [ -f "/tmp/pub_get.log" ] && echo "=== PUB GET ===" >> $LOG_FILE && cat /tmp/pub_get.log >> $LOG_FILE
          SNIPPET=$(grep -E "error:|Error|FAILED|Exception" /tmp/build.log 2>/dev/null | tail -10 | tr '\n' ' ' | cut -c1-400 || echo "cek log file")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            --data-urlencode "text=❌ Build Gagal! (${{ steps.build_info.outputs.build_type }}) | Error: ${SNIPPET}" \
            -d "parse_mode=HTML"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=$CHAT_ID" \
            -F "document=@$LOG_FILE" \
            -F "caption=📄 Full Error Log" || true
